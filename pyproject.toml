[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-int8-study"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }, { name = "micuniverse" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "nano-vLLM learning fork with INT8 KV cache experiments"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
    "ninja",
    "safetensors",
    "tqdm",
]

[project.urls]
Homepage="https://github.com/micuniverse/high-performance-inference-framework"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.setuptools.package-data]
"nanovllm.ops" = ["*.cu"]
